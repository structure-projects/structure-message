# 生产环境配置（Nacos 配置中心）
spring:
  main:
    allow-circular-references: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  # 数据源配置（生产环境）
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/message?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 15
      auto-commit: true
      idle-timeout: 30000
      pool-name: MessageHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  # Redis配置（生产环境）
  data:
    redis:
      host: redis
      port: 6379
      password: structure-cloud
      database: 0
      timeout: 5000ms
      lettuce: 
        pool: 
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # Flyway配置
  flyway:
    enabled: true
    clean-disabled: true
    table: flyway_schema_history
    out-of-order: false
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    locations: classpath:db/migration

  # RabbitMQ配置（生产环境）
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: rabbitmq
    password: rabbitmq
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        concurrency: 1
        max-concurrency: 1
        prefetch: 50
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
        acknowledge-mode: manual
        default-requeue-rejected: false

  # Nacos（生产环境开启）
  cloud:
    nacos:
      discovery:
        enabled: true

  # 导入子模块配置
  config:
    import:
      - optional:classpath:infra.yaml

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

# Structure配置
structure:
  # 数据权限配置
  data-scope:
    enabled: true
    scan-packages:
      - cn.structured.message.common.dto
    tenant-id-column: organization_id
    default-tenant-id: 10
  security:
    resource-id: message-service
    antMatchers:
      unAuthenticated:
        - /actuator/health
        - /open-api/**
